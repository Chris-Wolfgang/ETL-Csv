  assemblies:
  - Wolfgang.Etl.Csv
  namespace: Wolfgang.Etl.Csv
  summary: Gets or sets the encoding forwarded to CsvHelper's writer configuration.
  remarks: >-
    This value is informational only — it is passed to CsvHelper's

    <code>CsvConfiguration.Encoding</code> but does <b>not</b> control how characters are

    encoded into bytes on the output stream. Byte encoding is performed by the

    <xref href="System.IO.StreamWriter" data-throw-if-not-resolved="false"></xref> supplied to the constructor, and that writer's

    <xref href="System.IO.StreamWriter.Encoding" data-throw-if-not-resolved="false"></xref> is authoritative. To write a non-default

    encoding, construct the <xref href="System.IO.StreamWriter" data-throw-if-not-resolved="false"></xref> with the encoding you want

    and ignore this property.
  example: []
  syntax:
    content: public Encoding Encoding { get; set; }
    parameters: []
