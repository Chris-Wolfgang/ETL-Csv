  assemblies:
  - Wolfgang.Etl.Csv
  namespace: Wolfgang.Etl.Csv
  summary: >-
    Gets or sets a callback invoked when the underlying parser raises a

    recoverable parse exception (typically a type-conversion failure on a

    specific field). Use this to log, count, or send to telemetry.
  remarks: >-
    When <code>null</code> (the default), the exception is not logged by the library.

    The exception always propagates out of <code>ExtractAsync</code> regardless of

    the callback — this hook is for observation only. Wrap your <code>await foreach</code>

    in <code>try / catch</code> if you want to swallow individual row failures.

    <pre><code class="lang-csharp">extractor.ReadingExceptionOccurred = info =&gt;
        _logger.LogDebug(info.Exception, "Parse error on line {Line} column {Col}: {Value}",
            info.LineNumber, info.ColumnNumber, info.ColumnValue);</code></pre>
  example: []
