  assemblies:
  - Wolfgang.Etl.Csv
  namespace: Wolfgang.Etl.Csv
  summary: >-
    Gets or sets the 1-based index of the first line the parser will consume from

    the source. Lines before this index are read and discarded.
  remarks: >-
    The line at <xref href="Wolfgang.Etl.Csv.CsvExtractor%601.InitialRecordIndex" data-throw-if-not-resolved="false"></xref> is treated as the <i>first line read</i>,

    not necessarily the first data row. When <xref href="Wolfgang.Etl.Csv.CsvExtractor%601.HasHeaderRecord" data-throw-if-not-resolved="false"></xref> is <code>true</code>,

    it becomes the header row (column names); when <xref href="Wolfgang.Etl.Csv.CsvExtractor%601.HasHeaderRecord" data-throw-if-not-resolved="false"></xref> is

    <code>false</code>, it becomes the first data row. Set this to skip metadata or banner

    lines that precede the header / data section.
  example: []
  syntax:
    content: public int InitialRecordIndex { get; set; }
    parameters: []
    return:
      type: System.Int32
