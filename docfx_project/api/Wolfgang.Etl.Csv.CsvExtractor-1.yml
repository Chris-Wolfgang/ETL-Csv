  assemblies:
  - Wolfgang.Etl.Csv
  namespace: Wolfgang.Etl.Csv
  summary: >-
    Extracts records of type <code class="typeparamref">TRecord</code> from a CSV stream

    using <a href="https://joshclose.github.io/CsvHelper/">CsvHelper</a>.
  example:
  - >-
    <pre><code class="lang-csharp">using var reader = new StreamReader("people.csv");

    var extractor = new CsvExtractor&lt;Person&gt;(reader);

    await foreach (var person in extractor.ExtractAsync(cancellationToken))

    {
        Console.WriteLine(person.Name);
    }</code></pre>
