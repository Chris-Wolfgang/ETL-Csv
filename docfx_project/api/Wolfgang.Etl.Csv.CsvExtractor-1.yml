  assemblies:
  - Wolfgang.Etl.Csv
  namespace: Wolfgang.Etl.Csv
  summary: Gets or sets the encoding forwarded to the underlying parser configuration.
  remarks: >-
    This value is informational only — it is passed to CsvHelper's

    <code>CsvConfiguration.Encoding</code> but does <b>not</b> control how bytes are

    decoded into characters. Decoding happens inside the <xref href="System.IO.StreamReader" data-throw-if-not-resolved="false"></xref>

    supplied to the constructor, and that reader's <xref href="System.IO.StreamReader.CurrentEncoding" data-throw-if-not-resolved="false"></xref>

    is authoritative. To read a non-default encoding, construct the

    <xref href="System.IO.StreamReader" data-throw-if-not-resolved="false"></xref> with the encoding you want and ignore this property.
  example: []
