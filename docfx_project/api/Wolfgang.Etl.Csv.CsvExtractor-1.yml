  assemblies:
  - Wolfgang.Etl.Csv
  namespace: Wolfgang.Etl.Csv
  summary: >-
    Gets or sets a callback invoked when the underlying parser detects bad data.

    Use this to log, count, or quarantine bad records as they're encountered.
  remarks: >-
    When <code>null</code> (the default), bad data is silently counted via

    <xref href="Wolfgang.Etl.Csv.CsvExtractorProgress.CurrentBadDataCount" data-throw-if-not-resolved="false"></xref> but not logged — the

    library deliberately does not write CSV record contents to your logger,

    since CSV records frequently contain PII. Wire this to your logger if you

    want diagnostic output, e.g.:

    <pre><code class="lang-csharp">extractor.BadDataFound = info =&gt; _logger.LogDebug("Bad CSV data on line {Line}: {Field}", info.LineNumber, info.Field);</code></pre>

    Extraction always continues after a bad-data event. To abort, throw from

    the callback or trip the <xref href="System.Threading.CancellationToken" data-throw-if-not-resolved="false"></xref>

    passed to <code>ExtractAsync</code>.
  example: []
  syntax:
    content: public Action<CsvBadDataInfo>? BadDataFound { get; set; }
    parameters: []
    return:
      type: System.Action{Wolfgang.Etl.Csv.CsvBadDataInfo}
    content.vb: Public Property BadDataFound As Action(Of CsvBadDataInfo)
  overload: Wolfgang.Etl.Csv.CsvExtractor`1.BadDataFound*
  nameWithType.vb: CsvExtractor(Of TRecord).BadDataFound
  fullName.vb: Wolfgang.Etl.Csv.CsvExtractor(Of TRecord).BadDataFound
