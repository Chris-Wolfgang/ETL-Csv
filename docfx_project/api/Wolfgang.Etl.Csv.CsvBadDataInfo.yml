  - Wolfgang.Etl.Csv
  namespace: Wolfgang.Etl.Csv
  summary: Describes a bad-data event encountered while reading a CSV stream.
  example: []
  syntax:
    content: public CsvBadDataInfo(int LineNumber, int ColumnNumber, string? Field, string RawRecord)
    parameters:
    - id: LineNumber
      type: System.Int32
      description: >-
        The 1-based file line on which the bad data was encountered, or <code>-1</code> if unknown.

        Counts every physical line in the source, including comments and blank lines.
    - id: ColumnNumber
      type: System.Int32
      description: The 1-based column position of the bad field within the line, or <code>-1</code> if unknown.
    - id: Field
      type: System.String
      description: The raw field value that was flagged as bad data, or <code>null</code> if unavailable.
    - id: RawRecord
      type: System.String
      description: The full raw record (line) that contained the bad data.
    content.vb: Public Sub New(LineNumber As Integer, ColumnNumber As Integer, Field As String, RawRecord As String)
