  assemblies:
  - Wolfgang.Etl.Csv
  namespace: Wolfgang.Etl.Csv
  summary: >-
    Describes a recoverable parse exception encountered while reading a CSV stream.

    Surfaced to the caller via <xref href="Wolfgang.Etl.Csv.CsvExtractor%601.ReadingExceptionOccurred" data-throw-if-not-resolved="false"></xref>

    so logging, metrics, or quarantine logic can be plugged in without the library

    making logging decisions on the caller's behalf.
  remarks: >-
    The underlying exception always propagates out of the async iterator after the

    callback returns — this record is purely for observation. If the caller wants

    extraction to continue past parse errors they must catch the exception around

    their <code>await foreach</code>.
  example: []
  syntax:
    content: public CsvReadingExceptionInfo(int LineNumber, int ColumnNumber, string? ColumnName, string? ColumnValue, Exception Exception)
    parameters:
    - id: LineNumber
      type: System.Int32
      description: The 1-based file line where the exception was encountered, or <code>-1</code> if unknown.
    - id: ColumnNumber
      type: System.Int32
      description: The 1-based column position of the offending field, or <code>-1</code> if unknown.
    - id: ColumnName
      type: System.String
      description: The header name of the offending column, or <code>null</code> when unavailable (no header, or column index out of range).
    - id: ColumnValue
      type: System.String
      description: The raw field value that failed to parse, or <code>null</code> when unavailable.
    - id: Exception
      type: System.Exception
      description: The exception thrown by the underlying parser.
