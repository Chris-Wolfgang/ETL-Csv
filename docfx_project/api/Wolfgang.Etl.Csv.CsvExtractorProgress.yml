  summary: Initializes a new instance of the <xref href="Wolfgang.Etl.Csv.CsvExtractorProgress" data-throw-if-not-resolved="false"></xref> class.
  example: []
  syntax:
    content: public CsvExtractorProgress(int currentItemCount, int currentSkippedItemCount, int currentLineNumber, int currentBadDataCount)
    parameters:
    - id: currentItemCount
      type: System.Int32
      description: The number of items extracted so far.
    - id: currentSkippedItemCount
      type: System.Int32
      description: The number of items skipped so far.
    - id: currentLineNumber
      type: System.Int32
      description: >-
        The 1-based line number most recently read from the source, or <code>0</code> before reading begins.

        Counts every physical line in the source, including comments and blank lines.
    - id: currentBadDataCount
      type: System.Int32
      description: >-
        The number of bad-data events observed so far. Counts every invocation of the

        underlying parser's bad-data callback, regardless of whether the caller supplied

        a custom <code>BadDataFound</code> handler.
