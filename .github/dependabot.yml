version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
    ignore:
      # dotnet-stryker 5.0.0 cannot compile the mutated project (package-reference
      # resolution regression; mutation gate reports 0%). Hold the major until #274.
      - dependency-name: "dotnet-stryker"
        update-types: ["version-update:semver-major"]

  # Keep third-party GitHub Actions pinned in workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
