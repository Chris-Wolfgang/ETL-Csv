# zizmor baseline configuration.
#
# Suppress accepted-as-intentional findings here, with rule_id + path +
# rationale. Every entry must document WHY the rule is silenced for that
# path — a suppression without a rationale should not merge.
#
# Format: https://woodruffw.github.io/zizmor/configuration/

rules:
  dangerous-triggers:
    ignore:
      - path: .github/workflows/pr.yaml
        comment: |
          pull_request_target is the trigger the PR workflow deliberately
          uses so the workflow YAML that runs comes from `main` (trusted),
          while `refs/pull/N/head` is separately checked out for the actual
          test steps. A concurrent "Fetch trusted configuration files from
          main branch" step overwrites any protected-file changes the PR
          made (see the SECURITY NOTE at the top of pr.yaml). Converting to
          `pull_request` would remove the safe-configs guarantee and open
          the door to a malicious PR silencing analyzers.
